[project]
name = "codex-yoto-skill"
version = "0.1.0"
description = "Local scripts used by the Codex Yoto skill"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mutagen>=1.47,<2",
  "pillow>=10,<13",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
